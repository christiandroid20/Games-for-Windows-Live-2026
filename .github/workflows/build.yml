name: Build BladesOverlay and achievement test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package Windows x64 apps
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build BladesOverlay
        run: dotnet publish BladesOverlay.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/BladesOverlay

      - name: Build AchievementTest
        run: dotnet publish AchievementTest/AchievementTest.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/AchievementTest

      - name: Upload Windows x64 builds
        uses: actions/upload-artifact@v4
        with:
          name: BladesOverlay-Windows-x64
          path: artifacts/
          if-no-files-found: error
